name: gold-improve
on:
  schedule:
    - cron: "0 23 * * *"   # ทุกวัน 06:00 เวลาไทย
  workflow_dispatch:

concurrency:
  group: gold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python improve.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save updated parameters
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add params.json
          git diff --cached --quiet || (git commit -m "auto-update parameters" && git pull --rebase && git push)
