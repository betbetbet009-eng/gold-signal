name: gold-signal
on:
  schedule:
    # pre-alert before 4H bar close (covers NY summer/winter time)
    - cron: "35,50 0,1,4,5,8,9,12,13,16,17,20,21 * * *"
    # confirm after bar close
    - cron: "5 1,2,5,6,9,10,13,14,17,18,21,22 * * *"
  workflow_dispatch:

concurrency:
  group: gold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check_signal.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save sent-alert state
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update alert state" && git pull --rebase && git push)
