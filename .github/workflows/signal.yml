name: gold-signal
on:
  schedule:
    # สำรอง: ถ้ารอบวนหลุด ให้เริ่มใหม่ (รอบหลักวนต่อเนื่องเองจาก runner.py)
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: gold-loop
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python runner.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
